[project]
name = "mini2p-preprocessing"
version = "0.1.0"
description = "Mini2P / Big2P imaging preprocessing and nLightG2 analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "scipy>=1.11",
    "joblib>=1.3",
]

[project.optional-dependencies]
# registration itself; not needed to analyse existing Suite2p output
registration = ["suite2p", "tifffile"]

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlight"]

[tool.pytest.ini_options]
testpaths = ["tests/nlight"]
